<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario oficial de reserva de bicicletas y recorridos guiados en Rueda Libre, Medellín.">
    <title>Reserva tu Bicicleta | Rueda Libre</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Reserva tu bicicleta</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="tarifas.html">Tarifas y rutas</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="formulario-reserva">
            <h2>Formulario de reserva</h2>
            <p>Por favor completa los siguientes campos para tu solicitud de alquiler o recorrido guiado.</p>
            
            <form action="#" method="post">
                
                <fieldset>
                    <legend>Tus datos</legend>
                    
                    <div>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3">
                    </div>

                    <div>
                        <label for="documento">Documento de identidad:</label>
                        <input type="text" id="documento" name="documento" required pattern="[0-9]{6,10}" title="Debe contener solo números, entre 6 y 10 dígitos">
                    </div>

                    <div>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>

                    <div>
                        <label for="celular">Celular:</label>
                        <input type="tel" id="celular" name="celular" required pattern="3[0-9]{9}" title="Debe tener 10 dígitos y empezar obligatoriamente por 3">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Tu alquiler</legend>

                    <div>
                        <label for="fecha">Fecha del alquiler (Del 1 de nov al 31 de dic de 2026):</label>
                        <input type="date" id="fecha" name="fecha" required min="2026-11-01" max="2026-12-31">
                    </div>

                    <div>
                        <label for="tipo_bici">Tipo de bicicleta:</label>
                        <select id="tipo_bici" name="tipo_bici" required>
                            <option value="">-- Selecciona una bicicleta o indica que no necesitas una --</option>
                            <optgroup label="Alquiler Individual">
                                <option value="urbana">Bicicleta Urbana</option>
                                <option value="montana">Bicicleta de Montaña</option>
                                <option value="electrica">Bicicleta Electrica</option>
                            </optgroup>
                            <option value="sin_bicicleta">No necesito alquilar una bicicleta</option>
                        </select>
                    </div>

                    <div>
                        <label for="ruta">Recorrido guiado:</label>
                        <select id="ruta" name="ruta" required>
                            <option value="">-- Selecciona un recorrido o indica que no harás uno --</option>
                            <optgroup label="Recorridos Guiados">
                                <option value="rio_parques">Recorrido Río y Parques</option>
                                <option value="sabores_barrio">Recorrido Barrios</option>
                                <option value="reto_palmas">Recorrido Palmas</option>
                            </optgroup>
                            <option value="sin_recorrido">No haré un recorrido guiado</option>
                        </select>
                    </div>

                    <div>
                        <label for="cantidad">Cantidad de bicicletas (1 a 6):</label>
                        <input type="number" id="cantidad" name="cantidad" required min="1" max="6" value="1">
                    </div>

                    <div>
                        <label for="comentarios">Comentarios adicionales (máximo 300 caracteres):</label>
                        <textarea id="comentarios" name="comentarios" maxlength="300" rows="4"></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Confirmación</legend>

                    <div>
                        <input type="checkbox" id="politicas" name="politicas" required>
                        <label for="politicas">Acepto las políticas de alquiler *</label>
                    </div>
                </fieldset>

                <button type="submit">Enviar reserva</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rueda Libre. Contacto: <a href="mailto:hola@ruedalibre.ejemploriwi">hola@ruedalibre.ejemploriwi</a></p>
    </footer>

</body>
</html>
